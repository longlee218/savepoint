[workspace]
members = [
    "crates/savepoint-core",
    "crates/savepoint-fs",
    "crates/savepoint-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Savepoint Authors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/savepoint-ai/savepoint"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
tempfile = "3.13"
walkdir = "2.5"
sha2 = "0.10"
