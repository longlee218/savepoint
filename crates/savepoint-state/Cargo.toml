[package]
name = "savepoint-state"
description = "Snapshot/rewind adapters for out-of-tree state: SQLite, PostgreSQL, MySQL/MariaDB, Redis/Valkey and Memcached"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
sha2.workspace = true
tracing.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
postgres = "0.19"
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
redis = { version = "1", default-features = false }
percent-encoding = "2.3"

[dev-dependencies]
tempfile.workspace = true
